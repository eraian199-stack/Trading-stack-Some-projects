[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soccer-predictor"
version = "0.2.0"
description = "Unified soccer prediction: club + international match models, tournament simulation, and betting/research evaluation."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "plotly>=5.18",
    "streamlit>=1.32",
]

[project.optional-dependencies]
# Stronger gradient boosting (falls back to sklearn HistGradientBoosting if absent).
boost = ["lightgbm>=4.0"]
# Free xG ingestion from Understat (top-5 European leagues + RFPL).
xg = ["understatapi>=0.5"]
# All-in-one scraper alternative (Understat + ClubElo + football-data.co.uk).
scrape = ["soccerdata>=1.9"]
dev = ["pytest>=8.0"]

[project.scripts]
soccer-predictor = "soccer_predictor.cli:main"
# Backwards-compatible alias for the legacy command name.
world-cup-predictor = "soccer_predictor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["soccer_predictor*", "world_cup_predictor*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
